<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="Project preview placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.4" r="0.62">
      <stop offset="0%" stop-color="#94a3b8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect width="1200" height="750" fill="url(#halo)"/>
  <rect width="1200" height="750" fill="url(#grid)"/>
  <ellipse cx="590" cy="320" rx="330" ry="200" fill="#94a3b8" opacity="0.1" filter="url(#soft)"/>
  <g transform="rotate(-3 580 320)">
    <rect x="300" y="150" width="560" height="340" rx="20" fill="#020617" fill-opacity="0.72" stroke="url(#accent)" stroke-width="2"/>
    <circle cx="340" cy="186" r="8" fill="#f87171" opacity="0.7"/>
    <circle cx="366" cy="186" r="8" fill="#fbbf24" opacity="0.7"/>
    <circle cx="392" cy="186" r="8" fill="#94a3b8" opacity="0.7"/>
    <text x="330" y="266" font-family="'JetBrains Mono', Consolas, monospace" font-size="24" fill="#e2e8f0">&gt; project preview</text>
    <text x="330" y="310" font-family="'JetBrains Mono', Consolas, monospace" font-size="20" fill="#94a3b8">no screenshot available</text>
    <rect class="cursor" x="520" y="290" width="14" height="26" rx="3" fill="#cbd5e1"/>
    <rect x="330" y="424" width="500" height="10" rx="5" fill="#ffffff" fill-opacity="0.06"/>
  </g>
  <text x="600" y="596" text-anchor="middle" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="600" letter-spacing="4" fill="#94a3b8" opacity="0.9">OPEN SOURCE</text>
  <text x="600" y="650" text-anchor="middle" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="46" font-weight="700" fill="#ffffff">Project</text>
  <text x="600" y="694" text-anchor="middle" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="24" fill="#94a3b8">Preview coming soon</text>
  <style>
    .cursor { animation: blink 1.2s step-end infinite; }
    @keyframes blink {
      0%, 55% { opacity: 0.9; }
      56%, 100% { opacity: 0; }
    }
  </style>
</svg>
