<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect width="1200" height="750" fill="url(#grid)"/>
  <g transform="rotate(-6 380 320)">
    <rect x="220" y="180" width="320" height="220" rx="18" fill="#ffffff" fill-opacity="0.10" stroke="url(#card)" stroke-width="2"/>
    <rect x="250" y="215" width="130" height="14" rx="7" fill="url(#card)" opacity="0.9"/>
    <rect x="250" y="245" width="220" height="10" rx="5" fill="#ffffff" opacity="0.35"/>
    <rect x="250" y="268" width="180" height="10" rx="5" fill="#ffffff" opacity="0.25"/>
    <circle cx="500" cy="360" r="14" fill="url(#card)"/>
  </g>
  <g transform="rotate(5 720 380)">
    <rect x="560" y="280" width="300" height="200" rx="18" fill="#ffffff" fill-opacity="0.12" stroke="url(#card)" stroke-width="2"/>
    <rect x="590" y="315" width="100" height="14" rx="7" fill="url(#card)" opacity="0.9"/>
    <rect x="590" y="345" width="200" height="10" rx="5" fill="#ffffff" opacity="0.35"/>
    <rect x="590" y="368" width="150" height="10" rx="5" fill="#ffffff" opacity="0.25"/>
    <path d="M590 420 l40 -24 40 24 46 -28" fill="none" stroke="url(#card)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="600" y="655" text-anchor="middle" font-family="Inter, 'Segoe UI', 'PingFang SC', sans-serif" font-size="44" font-weight="700" fill="#ffffff">FlowBoard</text>
  <text x="600" y="700" text-anchor="middle" font-family="Inter, 'Segoe UI', 'PingFang SC', sans-serif" font-size="24" fill="#94a3b8">Realtime Collaborative Whiteboard</text>
</svg>
