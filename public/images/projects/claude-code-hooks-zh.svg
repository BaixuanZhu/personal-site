<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="Claude Code GUI Hooks 项目预览图">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.4" r="0.62">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fade" cx="0.5" cy="0.4" r="0.65">
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1"/>
    </radialGradient>
    <mask id="gridFade">
      <rect width="1200" height="750" fill="url(#fade)"/>
    </mask>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect width="1200" height="750" fill="url(#halo)"/>
  <rect width="1200" height="750" fill="url(#grid)" mask="url(#gridFade)"/>
  <ellipse cx="570" cy="330" rx="320" ry="200" fill="#fbbf24" opacity="0.13" filter="url(#soft)"/>
  <g transform="rotate(-3 470 280)">
    <path d="M300 170 h340 a16 16 0 0 1 16 16 v150 a16 16 0 0 1 -16 16 h-260 l-44 40 v-40 h-36 a16 16 0 0 1 -16 -16 v-150 a16 16 0 0 1 16 -16 z" fill="#ffffff" fill-opacity="0.10" stroke="url(#accent)" stroke-width="2"/>
    <rect x="340" y="205" width="250" height="16" rx="8" fill="url(#accent)" opacity="0.9"/>
    <rect x="340" y="243" width="220" height="12" rx="6" fill="#ffffff" opacity="0.45"/>
    <rect x="340" y="271" width="180" height="12" rx="6" fill="#ffffff" opacity="0.3"/>
    <rect x="340" y="299" width="130" height="12" rx="6" fill="#ffffff" opacity="0.3"/>
  </g>
  <g transform="rotate(4 740 400)">
    <path d="M600 320 h280 a14 14 0 0 1 14 14 v96 a14 14 0 0 1 -14 14 h-196 l-36 34 v-34 h-48 a14 14 0 0 1 -14 -14 v-96 a14 14 0 0 1 14 -14 z" fill="url(#accent)" opacity="0.88"/>
    <circle class="pip p1" cx="652" cy="382" r="14" fill="#451a03"/>
    <circle class="pip p2" cx="700" cy="382" r="14" fill="#451a03" opacity="0.6"/>
    <circle class="pip p3" cx="748" cy="382" r="14" fill="#451a03" opacity="0.35"/>
    <rect x="790" y="368" width="64" height="28" rx="14" fill="#451a03" opacity="0.85"/>
  </g>
  <text x="600" y="596" text-anchor="middle" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="600" letter-spacing="4" fill="#fbbf24" opacity="0.9">开源 · Claude Code 插件</text>
  <text x="600" y="650" text-anchor="middle" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="46" font-weight="700" fill="#ffffff">Claude Code GUI Hooks</text>
  <text x="600" y="694" text-anchor="middle" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="24" fill="#94a3b8">原生系统对话框 · 零依赖 · 跨平台</text>
  <style>
    .pip { animation: pip 3.6s ease-in-out infinite; }
    .p2 { animation-delay: 0.45s; }
    .p3 { animation-delay: 0.9s; }
    @keyframes pip {
      0%, 60%, 100% { opacity: 0.35; }
      30% { opacity: 1; }
    }
  </style>
</svg>
