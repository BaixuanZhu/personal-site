    <rect x="480" y="380" width="180" height="120" rx="14" fill="#ffffff" fill-opacity="0.08"/>
    <rect x="690" y="380" width="180" height="120" rx="90" fill="url(#accent)" fill-opacity="0.22"/>
  </g>
  <g fill="url(#accent)">
    <rect x="298" y="258" width="80" height="10" rx="5"/>
