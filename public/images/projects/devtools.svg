<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="DevTools project preview">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c2f4e"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.4" r="0.62">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fade" cx="0.5" cy="0.4" r="0.65">
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1"/>
    </radialGradient>
    <mask id="gridFade">
      <rect width="1200" height="750" fill="url(#fade)"/>
    </mask>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect width="1200" height="750" fill="url(#halo)"/>
  <rect width="1200" height="750" fill="url(#grid)" mask="url(#gridFade)"/>
  <ellipse cx="570" cy="330" rx="320" ry="200" fill="#38bdf8" opacity="0.14" filter="url(#soft)"/>
  <g transform="rotate(-4 560 330)">
    <rect x="300" y="140" width="520" height="360" rx="20" fill="#ffffff" fill-opacity="0.08" stroke="url(#accent)" stroke-width="2"/>
    <circle cx="340" cy="176" r="8" fill="#f87171" opacity="0.85"/>
    <circle cx="366" cy="176" r="8" fill="#fbbf24" opacity="0.85"/>
    <circle cx="392" cy="176" r="8" fill="#34d399" opacity="0.85"/>
    <g fill="#ffffff" fill-opacity="0.14">
      <rect x="340" y="205" width="140" height="120" rx="12"/>
      <rect x="500" y="205" width="140" height="120" rx="12"/>
      <rect x="660" y="205" width="120" height="120" rx="12"/>
      <rect x="340" y="345" width="120" height="120" rx="12"/>
      <rect x="660" y="345" width="140" height="120" rx="12"/>
    </g>
    <g class="hot">
      <rect x="490" y="337" width="152" height="136" rx="12" fill="url(#accent)" opacity="0.88"/>
      <rect x="512" y="367" width="70" height="12" rx="6" fill="#0f172a" opacity="0.55"/>
      <rect x="512" y="393" width="108" height="8" rx="4" fill="#0f172a" opacity="0.35"/>
      <rect x="512" y="411" width="88" height="8" rx="4" fill="#0f172a" opacity="0.35"/>
      <circle cx="610" cy="443" r="12" fill="#0f172a" opacity="0.5"/>
    </g>
  </g>
  <text x="600" y="596" text-anchor="middle" font-family="Inter, 'Segoe UI', 'PingFang SC', sans-serif" font-size="20" font-weight="600" letter-spacing="4" fill="#38bdf8" opacity="0.9">OPEN SOURCE · WEB APP</text>
  <text x="600" y="650" text-anchor="middle" font-family="Inter, 'Segoe UI', 'PingFang SC', sans-serif" font-size="46" font-weight="700" fill="#ffffff">DevTools</text>
  <text x="600" y="694" text-anchor="middle" font-family="Inter, 'Segoe UI', 'PingFang SC', sans-serif" font-size="24" fill="#94a3b8">all local · no upload</text>
  <style>
    .hot { animation: breathe 4.5s ease-in-out infinite; }
    @keyframes breathe {
      0%, 100% { opacity: 0.72; }
      50% { opacity: 1; }
    }
  </style>
</svg>
