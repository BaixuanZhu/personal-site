<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="Agent Skills project preview">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2e1065"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.4" r="0.62">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fade" cx="0.5" cy="0.4" r="0.65">
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1"/>
    </radialGradient>
    <mask id="gridFade">
      <rect width="1200" height="750" fill="url(#fade)"/>
    </mask>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect width="1200" height="750" fill="url(#halo)"/>
  <rect width="1200" height="750" fill="url(#grid)" mask="url(#gridFade)"/>
  <ellipse cx="600" cy="330" rx="340" ry="200" fill="#a78bfa" opacity="0.14" filter="url(#soft)"/>
  <g transform="rotate(-2 600 330)">
    <rect x="280" y="140" width="640" height="380" rx="20" fill="#020617" fill-opacity="0.72" stroke="url(#accent)" stroke-width="2"/>
    <circle cx="320" cy="176" r="8" fill="#f87171" opacity="0.85"/>
    <circle cx="346" cy="176" r="8" fill="#fbbf24" opacity="0.85"/>
    <circle cx="372" cy="176" r="8" fill="#34d399" opacity="0.85"/>
    <text x="320" y="248" font-family="'JetBrains Mono', Consolas, monospace" font-size="21" fill="#e2e8f0">$ npx skills add java-coding-guide-pro</text>
    <rect class="cursor" x="820" y="228" width="13" height="26" rx="3" fill="#a78bfa"/>
    <text class="il il1" x="320" y="294" font-family="'JetBrains Mono', Consolas, monospace" font-size="20" fill="#a78bfa">✓ repo-init</text>
    <text class="il il2" x="320" y="330" font-family="'JetBrains Mono', Consolas, monospace" font-size="20" fill="#a78bfa">✓ java-coding-guide-pro</text>
    <text class="il il3" x="320" y="366" font-family="'JetBrains Mono', Consolas, monospace" font-size="20" fill="#a78bfa">✓ java-coding-quality</text>
    <text class="il il4" x="320" y="402" font-family="'JetBrains Mono', Consolas, monospace" font-size="20" fill="#a78bfa">✓ sa-token-dev</text>
    <text class="il il5" x="320" y="438" font-family="'JetBrains Mono', Consolas, monospace" font-size="20" fill="#64748b">+ more skills …</text>
    <text x="320" y="478" font-family="'JetBrains Mono', Consolas, monospace" font-size="20" fill="#f472b6">all skills installed · 41+ agents supported</text>
    <rect x="320" y="492" width="560" height="8" rx="4" fill="#ffffff" fill-opacity="0.08"/>
  </g>
  <text x="600" y="596" text-anchor="middle" font-family="Inter, 'Segoe UI', 'PingFang SC', sans-serif" font-size="20" font-weight="600" letter-spacing="4" fill="#a78bfa" opacity="0.9">OPEN SOURCE · AI AGENT</text>
  <text x="600" y="650" text-anchor="middle" font-family="Inter, 'Segoe UI', 'PingFang SC', sans-serif" font-size="46" font-weight="700" fill="#ffffff">Agent Skills</text>
  <text x="600" y="694" text-anchor="middle" font-family="Inter, 'Segoe UI', 'PingFang SC', sans-serif" font-size="24" fill="#94a3b8">Chinese Java ecosystem · 41+ agents</text>
  <style>
    .il { animation: install 5.6s ease-in-out infinite; }
    .il2 { animation-delay: 0.55s; }
    .il3 { animation-delay: 1.1s; }
    .il4 { animation-delay: 1.65s; }
    .il5 { animation-delay: 2.2s; }
    @keyframes install {
      0% { opacity: 0.3; }
      8% { opacity: 1; }
      78% { opacity: 1; }
      88%, 100% { opacity: 0.3; }
    }
    .cursor { animation: blink 1.2s step-end infinite; }
    @keyframes blink {
      0%, 55% { opacity: 0.9; }
      56%, 100% { opacity: 0; }
    }
  </style>
</svg>
