<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="jvm 项目预览图">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#052e26"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.4" r="0.62">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fade" cx="0.5" cy="0.4" r="0.65">
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1"/>
    </radialGradient>
    <mask id="gridFade">
      <rect width="1200" height="750" fill="url(#fade)"/>
    </mask>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#a3e635"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect width="1200" height="750" fill="url(#halo)"/>
  <rect width="1200" height="750" fill="url(#grid)" mask="url(#gridFade)"/>
  <ellipse cx="590" cy="320" rx="330" ry="200" fill="#34d399" opacity="0.14" filter="url(#soft)"/>
  <g transform="rotate(-3 580 320)">
    <rect x="300" y="150" width="560" height="340" rx="20" fill="#020617" fill-opacity="0.72" stroke="url(#accent)" stroke-width="2"/>
    <circle cx="340" cy="186" r="8" fill="#f87171" opacity="0.85"/>
    <circle cx="366" cy="186" r="8" fill="#fbbf24" opacity="0.85"/>
    <circle cx="392" cy="186" r="8" fill="#34d399" opacity="0.85"/>
    <text x="330" y="252" font-family="'JetBrains Mono', Consolas, monospace" font-size="26" fill="#e2e8f0">&gt; jvm install 21</text>
    <text x="330" y="292" font-family="'JetBrains Mono', Consolas, monospace" font-size="21" fill="#64748b">downloading temurin 21 … sha256 ok</text>
    <text x="330" y="342" font-family="'JetBrains Mono', Consolas, monospace" font-size="26" fill="#e2e8f0">&gt; jvm use 21</text>
    <text x="330" y="382" font-family="'JetBrains Mono', Consolas, monospace" font-size="21" fill="#34d399">✓ java 21 ready in this terminal</text>
    <rect class="cursor" x="745" y="362" width="14" height="26" rx="3" fill="#34d399"/>
    <rect x="330" y="424" width="500" height="10" rx="5" fill="#ffffff" fill-opacity="0.08"/>
    <rect class="bar" x="330" y="424" width="500" height="10" rx="5" fill="url(#accent)" opacity="0.85"/>
  </g>
  <text x="600" y="596" text-anchor="middle" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="600" letter-spacing="4" fill="#34d399" opacity="0.9">开源 · 命令行工具</text>
  <text x="600" y="650" text-anchor="middle" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="46" font-weight="700" fill="#ffffff">jvm</text>
  <text x="600" y="694" text-anchor="middle" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="24" fill="#94a3b8">Windows 下的 Java 版本管理器 · Go</text>
  <style>
    .bar {
      transform-box: fill-box;
      transform-origin: left center;
      animation: barfill 5.2s ease-in-out infinite;
    }
    @keyframes barfill {
      0% { transform: scaleX(0.05); opacity: 0.85; }
      55% { transform: scaleX(1); }
      78% { transform: scaleX(1); opacity: 0.85; }
      88% { opacity: 0; }
      100% { transform: scaleX(0.05); opacity: 0; }
    }
    .cursor { animation: blink 1.2s step-end infinite; }
    @keyframes blink {
      0%, 55% { opacity: 0.9; }
      56%, 100% { opacity: 0; }
    }
  </style>
</svg>
